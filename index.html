<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Enter your address to get your polling place, early-voting and drop-off options, and your full sample ballot. Nonpartisan." />
    <meta name="theme-color" content="#1e40af" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Civic: your voting plan</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Netlify Forms detects forms at build time from static HTML. The app submits to this form via fetch. -->
    <form name="report" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="kind" /><textarea name="message"></textarea><input type="email" name="email" />
      <input type="text" name="page" /><input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
